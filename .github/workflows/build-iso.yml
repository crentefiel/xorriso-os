name: xorriso Alpha 0.15 - Build and smoke test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check script syntax before installing dependencies
        run: |
          for script in src/ai-request.sh src/ai-agent.sh src/local.sh src/network.sh src/storage.sh src/model.sh src/runtime.sh src/loopback.sh src/ai-boot.sh src/actions.sh; do
            sh -n "$script"
          done
          for script in src/test-*.sh build-from-source.sh; do
            bash -n "$script"
          done
      - name: Install Linux, ISO tools and tests
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential linux-image-generic busybox-static grub-common grub-pc-bin grub2-common \
            xorriso mtools cpio gzip zstd xz-utils curl jq ca-certificates qemu-system-x86 python3 e2fsprogs
      - name: Test AI executor against mock APIs
        run: |
          bash src/test-ai.sh
          bash src/test-model.sh
          bash src/test-runtime.sh
          bash src/test-actions.sh
          python3 src/test-http-real.py
      - name: Build ISO from source
        run: bash build-from-source.sh
      - name: Verify ISO format
        run: |
          test -s dist/xorriso-alpha-015-grub.iso
          xorriso -indev dist/xorriso-alpha-015-grub.iso -report_el_torito plain
      - name: Smoke test PID1 with QEMU
        run: |
          set +e
          timeout 35s qemu-system-x86_64 -m 1024 -no-reboot -display none -serial stdio \
            -kernel dist/vmlinuz -initrd dist/initramfs.cpio.gz \
            -append 'console=ttyS0 loglevel=7 rdinit=/init' -nic none \
            > dist/qemu-boot.log 2>&1
          status=$?
          set -e
          tail -50 dist/qemu-boot.log
          grep -F 'xorriso: init reached successfully' dist/qemu-boot.log
          echo "QEMU exit code: $status"
      - name: Test localhost TCP inside booted Linux guest
        run: timeout 55s python3 src/test-qemu-loopback.py
      - name: Test guest DHCP and MiniCPM host API bridge (simulated)
        run: timeout 85s python3 src/test-qemu-host-bridge.py
      - name: Verify optional ext4 data survives two guest boots
        run: timeout 120s python3 src/test-qemu-persistence.py
      - name: Verify existing model VDI plus separate read-only runtime VDI
        run: timeout 145s python3 src/test-qemu-dual-disk.py
      - name: Boot real ISO; verify automatic AI chat and F2/Esc

        run: timeout 95s python3 src/test-iso-qemu.py dist/xorriso-alpha-015-grub.iso
      - uses: actions/upload-artifact@v4
        with:
          name: xorriso-alpha-015-grub
          path: |
            dist/xorriso-alpha-015-grub.iso
            dist/SHA256SUMS
            dist/qemu-boot.log
            dist/qemu-host-bridge.log
            dist/qemu-loopback.log
            dist/qemu-persistence-*.log
            dist/qemu-dual-*.log
            dist/qemu-iso-*.log
            dist/qemu-iso-*.ppm
          retention-days: 14
          if-no-files-found: error
