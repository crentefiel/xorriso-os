# Debian's Live cleanup, limited to packages installed in the target.
# The minimal offline medium has no APT records for optional Live packages.
backend: apt
operations:
  - remove:
      - '?and(?installed,?exact-name(live-boot))'
      - '?and(?installed,?exact-name(live-boot-doc))'
      - '?and(?installed,?exact-name(live-config))'
      - '?and(?installed,?exact-name(live-config-doc))'
      - '?and(?installed,?exact-name(live-config-systemd))'
      - '?and(?installed,?exact-name(live-tools))'
      - '?and(?installed,?exact-name(live-task-localisation))'
      - '?and(?installed,?exact-name(live-task-recommended))'
      - '?and(?installed,?exact-name(calamares-settings-debian))'
